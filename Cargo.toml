[package]
name = "frameplay"
version = "0.1.0"

description.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
frameplay-lib = { path = "./lib", version = "*", features = ["async-tokio"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }

[workspace]
members = ["lib"]

[workspace.package]
description = "Simple frame repeater and library"
edition = "2024"
authors = ["Charles Dong <chardon_cs@proton.me>"]
repository = "https://github.com/chardoncs/frameplay.git"
license = "MIT"
