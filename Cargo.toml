[package]
name = "frameplay"
version = "0.1.0"

edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
frameplay-lib = { path = "./lib" }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace]
members = ["lib"]

[workspace.package]
edition = "2024"
authors = ["Charles Dong <chardon_cs@proton.me>"]
repository = "https://github.com/chardoncs/frameplay.git"
license = "MIT"
